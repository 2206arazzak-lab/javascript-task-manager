<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#f4f6fb">
  <title>Task Manager</title>
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>
<body>
  <main class="task-manager">
    <header class="page-header">
      <p class="eyebrow">STAY ON TRACK</p>
      <h1>Task Manager</h1>
      <p class="subtitle">Keep your tasks organized and moving forward.</p>
    </header>

    <section class="task-panel" aria-labelledby="tasks-heading">
      <h2 id="tasks-heading">Your tasks</h2>
      <form id="task-form" class="task-form">
        <label class="visually-hidden" for="task-input">New task</label>
        <input id="task-input" type="text" placeholder="What needs to get done?" autocomplete="off">
        <button type="submit">Add task</button>
      </form>

      <p id="task-count" class="task-count" aria-live="polite">0 tasks</p>
      <ul id="task-list" class="task-list" aria-label="Tasks"></ul>
    </section>
  </main>
</body>
</html>
